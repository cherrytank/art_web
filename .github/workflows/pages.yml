name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install image tools
        run: python -m pip install --requirement requirements.txt

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static HTML
        run: python tools/build_site.py
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          name: github-pages

      # 上傳完成後，清單 API 可能尚未同步；確認同一次執行的產物可見才部署。
      - name: Wait for Pages artifact metadata
        uses: actions/github-script@v7
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        with:
          script: |
            const expectedId = process.env.PAGES_ARTIFACT_ID;
            if (!expectedId) {
              throw new Error('Upload step did not return a Pages artifact ID.');
            }
            for (let attempt = 1; attempt <= 12; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });
              const artifact = artifacts.find(item =>
                String(item.id) === expectedId && item.name === 'github-pages' && !item.expired);
              if (artifact) {
                core.info(`Pages artifact ${artifact.id} is available (${artifact.size_in_bytes} bytes).`);
                return;
              }
              core.info(`Waiting for artifact metadata (${attempt}/12).`);
              if (attempt < 12) await new Promise(resolve => setTimeout(resolve, 10000));
            }
            throw new Error('Pages artifact metadata is still unavailable after 12 checks. Re-run the workflow later.');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
