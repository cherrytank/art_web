<section class="page-hero exhibitions-hero">
  <div>
    <header class="page-heading">
      <h1>展覽資訊</h1>
      <p class="section-kicker">Exhibitions &amp; Art Activities</p>
    </header>
    <p class="editable-copy">{{intro}}</p>
  </div>
  {{hero_image}}
</section>
<section class="current-exhibitions page-section">
  <div class="section-heading">
    <p class="section-kicker">Current Exhibition</p>
    <h2>當期展覽</h2>
  </div>
  <div class="current-exhibition-list">{{current_exhibitions}}</div>
</section>
<section class="exhibition-list page-section">
  <div class="section-heading">
    <p class="section-kicker">Chronology</p>
    <h2>歷年展覽</h2>
  </div>
  <div class="exhibition-rows">{{exhibitions}}</div>
</section>
