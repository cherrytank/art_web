<section class="about-hero page-section dark-surface">
  <div class="about-intro">
    <p class="section-kicker">學經歷・創作理念・藝術經歷</p>
    <h1>學經歷<small>Education &amp;<br>Experience</small></h1>
    <div class="short-rule"></div>
    <p>{{intro_zh}}</p>
    <p class="en-copy">{{intro_en}}</p>
  </div>
  <figure class="about-portrait"><img src="{{root}}assets/images/artist-portrait.webp" alt="沈東榮自畫像"></figure>
  <div class="about-timeline">
    <p class="birth-year"><strong>1969</strong><span>生於台灣・宜蘭</span></p>
    <h2>學歷 <small>Education</small></h2>
    <div class="timeline-list">{{education}}</div>
    <h2>曾任 <small>Previous Positions</small></h2>
    <div class="position-list">{{positions}}</div>
    <h2>現任 <small>Current Position</small></h2>
    <p>{{current}}</p>
  </div>
</section>
<section class="philosophy page-section">
  <div>
    <p class="section-kicker">Artist Statement</p>
    <h2>創作理念</h2>
  </div>
  <p>{{philosophy}}</p>
</section>
