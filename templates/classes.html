<section class="class-hero">
  <img src="{{root}}assets/images/artist-studio.webp" alt="沈東榮於工作室進行油畫創作">
  <div class="class-hero-copy">
    <p class="section-kicker">Oil Painting Classes</p>
    <h1>{{title}}</h1>
    <p>{{intro}}</p>
  </div>
</section>
<section class="course-layout page-section">
  <div class="course-info">
    <p class="section-kicker">Course Information</p>
    <h2>課程資訊</h2>
    <dl>
      <div><dt>課程內容</dt><dd>{{course}}</dd></div>
      <div><dt>上課時間</dt><dd>{{schedule}}</dd></div>
      <div><dt>上課地點</dt><dd>{{location}}</dd></div>
    </dl>
    <a class="outline-button" href="mailto:shentungjung.art@gmail.com?subject=Oil%20Painting%20Class">報名與課程諮詢 <span>→</span></a>
  </div>
  <figure class="course-image"><img src="{{root}}assets/images/work-white-flower.webp" alt="白花與藍色花器的油畫示範作品"></figure>
  <div class="course-features">
    <p class="section-kicker">Features</p>
    <h2>課程特色</h2>
    <ol>{{features}}</ol>
  </div>
</section>
