<article class="article-detail page-section">
  <a class="back-link" href="{{root}}writings/index.html">← 返回文章列表</a>
  <header class="article-header">
    <div>
      <p class="article-meta"><time datetime="{{date}}">{{date_display}}</time><span>{{category_zh}}・{{category_en}}</span></p>
      <h1>{{title}}</h1>
      <p class="article-summary">{{summary}}</p>
    </div>
    {{article_image}}
  </header>
  <div class="article-body">{{body}}</div>
</article>
