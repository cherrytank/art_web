<section class="contact-page page-section">
  <div class="contact-intro">
    <header class="page-heading">
      <h1>聯絡我們</h1>
      <p class="section-kicker">Contact</p>
    </header>
    <p class="editable-copy">{{intro}}</p>
  </div>
  <section class="official-account" aria-labelledby="official-heading">
    <a class="official-logo" href="{{official_url}}" target="_blank" rel="noopener noreferrer">{{logo_image}}</a>
    <div>
      <p class="section-kicker">Official Account</p>
      <h2 id="official-heading">畫作收藏所<span>（官方帳號）</span></h2>
      <p>一起幫畫作找到屬於他的家</p>
      <a href="{{official_url}}" target="_blank" rel="noopener noreferrer">@homeforpainting.art ↗</a>
    </div>
  </section>
  <div class="social-grid">{{social_cards}}</div>
  <div class="contact-email">
    <span>Email</span>
    <a href="mailto:{{email}}">{{email}} ↗</a>
  </div>
  {{signature_image}}
</section>
