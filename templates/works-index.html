<section class="page-hero works-hero">
  <div>
    <header class="page-heading">
      <h1>作品</h1>
      <p class="section-kicker">Selected Works</p>
    </header>
    <p class="editable-copy">{{intro}}</p>
  </div>
  {{hero_image}}
</section>
<section class="catalog page-section">
  <div class="catalog-tools">
    <form class="work-search" data-work-search-form role="search">
      <label class="search-field"><span>Search Artworks</span><span class="search-control"><input type="search" placeholder="Artwork Title, Number, or Year" data-work-search><button type="submit">搜尋</button></span></label>
    </form>
    <label class="select-field"><span>Year</span><select data-work-year><option value="all">All years</option>{{year_options}}</select></label>
    <p class="result-count" aria-live="polite" data-work-count>{{work_count}} 件作品</p>
  </div>
  <div class="works-grid" data-work-grid>{{works}}</div>
  <p class="empty-message" hidden data-work-empty>沒有符合條件的作品。</p>
</section>
