<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#f4f0e9">
  <script>document.documentElement.classList.add('js')</script>
  {{social_meta}}
  <title>{{title}}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{root}}assets/css/styles.css?v={{css_version}}">
</head>
<body class="{{body_class}}">
  <a class="skip-link" href="#main-content">跳至主要內容</a>
  <header class="site-header" data-header>
    <a class="brand" href="{{root}}index.html" aria-label="沈東榮首頁">
      <span class="brand-en">SHEN TUNG-JUNG</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span>選單</span><i></i><i></i>
    </button>
    <nav class="site-nav" id="site-nav" aria-label="主要導覽">
      <a {{home_active}} href="{{root}}index.html"><span>首頁</span><small>Home</small></a>
      <div class="nav-group">
        <button {{about_active}} class="submenu-toggle" aria-expanded="false" aria-controls="about-menu" type="button"><span>關於</span><small>About</small></button>
        <div class="nav-submenu" id="about-menu" hidden>
          <a href="{{root}}about/index.html">學經歷</a>
          <a href="{{root}}about/philosophy/index.html">創作理念</a>
          <a href="{{root}}about/chronology/index.html">年表．大事記</a>
        </div>
      </div>
      <a {{works_active}} href="{{root}}works/index.html"><span>作品</span><small>Works</small></a>
      <a {{exhibitions_active}} href="{{root}}exhibitions/index.html"><span>展覽資訊</span><small>Exhibitions</small></a>
      <a {{classes_active}} href="{{root}}classes/index.html"><span>油畫教學</span><small>Oil Painting Classes</small></a>
      <div class="nav-group">
        <button {{writings_active}} class="submenu-toggle" aria-expanded="false" aria-controls="writings-menu" type="button"><span>藝評．文章</span><small>Writings</small></button>
        <div class="nav-submenu" id="writings-menu" hidden>
          <a href="{{root}}writings/index.html?category=art-criticism#article-list">藝術評論</a>
          <a href="{{root}}writings/index.html?category=painting-notes#article-list">創作筆記</a>
          <a href="{{root}}writings/index.html?category=artwork-story#article-list">作品故事</a>
          <a href="{{root}}writings/index.html?category=publications#article-list">出版品</a>
        </div>
      </div>
      <a {{contact_active}} href="{{root}}contact/index.html"><span>聯絡我們</span><small>Contact</small></a>
    </nav>
  </header>
  <main id="main-content">{{main}}</main>
  <footer class="site-footer">
    <p><span>沈東榮</span> SHEN TUNG-JUNG</p>
    <p>© {{year}} Shen Tung-Jung. All rights reserved.</p>
  </footer>
  <dialog class="image-lightbox" id="image-lightbox" data-lightbox-dialog aria-label="圖片放大檢視">
    <div class="image-lightbox-inner">
      <button class="image-lightbox-close" type="button" data-lightbox-close aria-label="關閉放大圖片">×</button>
      <div class="image-lightbox-media" data-lightbox-media></div>
      <p class="image-lightbox-caption" data-lightbox-caption></p>
    </div>
  </dialog>
  <script src="{{root}}assets/js/site.js?v={{js_version}}" defer></script>
</body>
</html>
